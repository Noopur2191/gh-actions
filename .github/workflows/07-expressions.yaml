# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 07 - Using Expressions
run-name: "07 - Using Expressions | DEBUG - ${{ inputs.debug == 'true' && 'ON' || 'OFF' }}"

on: 
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                description: 'Set to true to enable debug mode'
                required: false
                default: false
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: "[debug] Print start-up data"
              if: ${{ inputs.debug == 'true' }}
              run: |
                echo "Triggered by: ${{ github.event_name }}"
                echo "Branch: ${{ github.ref }}"
                echo "Commit SHA: ${{ github.sha }}"
                echo "Runner OS: ${{ runner.os }}"
            - name: "[debug] Print when triggered from main"
              if: ${{ inputs.debug == 'true' && github.ref == 'refs/heads/main' }}
              run: echo "This workflow was triggered by a push to the main branch."
            - name: Greeting
              run: echo "Hello, world"